<!DOCTYPE html><html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matthew Yacavone | 404</title>
<script>
  const pathname = window.location.pathname;
  const search = window.location.search;
  const hash = window.location.hash;
  // Convert to lowercase, with some special cases
  const new_pathname = pathname.toLowerCase()
    .replaceAll('shapeshifter99', 'shape-shifter')
    .replaceAll('shape-shifter-250', 'shape-shifter')
    .replaceAll('tttikkun', 'ttTikkun')
  // Redirect if we have a new URL
  if (pathname != new_pathname) {
    window.location.replace(new_pathname + search + hash);
  }
  else {
    document.addEventListener("DOMContentLoaded", () =>
      document.getElementById('body').style.visibility = '');
  }
</script>
<link rel="stylesheet" href="style.css" />
</head>
<body id="body" style="visibility: hidden;">
